
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="quote-box">

            <h1>Random Quote Generator</h1>
            <p class="subtitle">Get inspired with a new quote every day.</p>

            <div class="quote-icon">❝</div>

            <div id="quote">
                Click the button below to discover an inspiring quote!
            </div>

            <div id="author">- Quote Generator</div>

            <div class="buttons">
                <button id="newQuoteBtn">New Quote</button>
                <button id="copyBtn">Copy Quote</button>
            </div>

            <p id="message"></p>

            <footer>
                Made with ❤️ using HTML, CSS and JavaScript
            </footer>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
